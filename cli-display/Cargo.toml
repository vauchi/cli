[package]
name = "vauchi-cli-display"
version = "0.2.1"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Command-line display shell for the Vauchi presentation contract"

[dependencies]
vauchi-contract = { git = "https://gitlab.com/vauchi/contract.git", tag = "v0.98.0", version = "=0.98.0" }
console = "0.15"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
