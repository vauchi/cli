# Mutants that are equivalent or unreachable, each with its reason
# (vauchi/private#505).
exclude_re = [
    # `printed` is an i32 counter only read modulo 5: counting down from 0
    # hits a multiple of 5 on exactly the same networks as counting up.
    "replace \\+= with -= in display_social_networks",
    # No cli flow fires an aha moment: exchange complete saves through
    # save_exchanged_contact, which skips the first-contact milestone
    # (vauchi/private#507). The box itself is tested via aha_moment_lines.
    "replace display_aha_moment with \\(\\)",
    # The dialoguer prompt and the commands' outer shells around it need a
    # real terminal: dialoguer refuses a piped stdin ("not a terminal").
    # What follows the answer is tested through the *_answered functions.
    "replace prompt -> Result<String>",
    "replace (schedule_deletion|execute_deletion|panic_shred) -> Result<\\(\\)> with Ok\\(\\(\\)\\)",
    "replace print_lines with \\(\\)",
    # Both relay clients are built identically and succeed or fail together,
    # so `||` and `&&` pick the same branch.
    "replace \\|\\| with && in panic_shred_answered",
    # Hands the URI to the operating system's opener; what it opens and
    # reports is tested through action_uri, opened_description and
    # action_value.
    "replace execute_action -> Result<\\(\\)> with Ok\\(\\(\\)\\)",
    # Observed 2026-10-05: after a relay-less exchange neither side has a
    # sending ratchet, so propagate_card_update queues to nobody and the
    # report never prints. queued_message carries the logic and is tested.
    "replace report_queued with \\(\\)",
    # Interactive dialoguer prompts need a terminal (see the GDPR entries).
    "replace add_social_interactive -> Result<\\(\\)> with Ok\\(\\(\\)\\)",
    "confirm_vouch",
    # The only `!` left in vouch guards the answer to that prompt.
    "delete ! in vouch",
    # Printed only after a successful sync against a live relay.
    "src/commands/sync\\.rs:.*delete ! in run$",
    # contacts open hands the field's URI to the OS opener; the field
    # lookup and the report text are tested as find_field and
    # opened_field_description. open_interactive is a dialoguer menu.
    "replace open_field -> Result<\\(\\)> with Ok\\(\\(\\)\\)",
    "replace open_interactive -> Result<\\(\\)> with Ok\\(\\(\\)\\)",
    "delete ! in open_interactive",
    # Device linking past the parts tests reach: typed confirmations
    # (dialoguer), and `finish`, which needs the other device over a relay.
    "replace != with == in (join|revoke)$",
    "replace finish -> Result<\\(\\)> with Ok\\(\\(\\)\\)",
    "delete ! in finish$",
    # A passing probe needs a live OHTTP relay and gateway.
    "replace ohttp_probe -> u8 with 1",
    # The "(this device)" marker is printed from the device registry, which
    # exists only after a second device was linked over a relay.
    "src/commands/device\\.rs:.*replace == with != in list$",
]
