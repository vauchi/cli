# GitLab CI for vauchi-cli
#
# Command-line interface
#
# Performance optimizations:
#   - Self-hosted runners: sccache, persistent caches, load-balanced
#   - Change-based rules: Jobs run only when relevant files change
#   - Timeouts: Prevent runaway jobs from blocking runners
#   - Read-only cache for lint jobs
#
# Pipeline strategy:
#   - MR: Validation on relevant file changes
#   - Upstream trigger: Verify compatibility when core merges to main
#
# Uses shared templates from vauchi/scripts for consistency.

# Include shared templates
include:
  - project: 'vauchi/scripts'
    ref: ci-templates-v2026.11.17
    file:
      - '/ci-templates/rust-base.yml'
      - '/ci-templates/allow-git.yml'
      - '/ci-templates/allow-direct-guard.yml'
      - '/ci-templates/security.yml'
      - '/ci-templates/coverage.yml'
      - '/ci-templates/mr-rules.yml'
      - '/ci-templates/downstream.yml'
      - '/ci-templates/reuse.yml'
      - '/ci-templates/release.yml'
      - '/ci-templates/test-quality.yml'
      - '/ci-templates/file-size.yml'
      - '/ci-templates/mutation.yml'
      - '/ci-templates/content-fetch.yml'
      - '/ci-templates/freshness.yml'
      - '/ci-templates/perf.yml'
      - '/ci-templates/design-drift.yml'
      - '/ci-templates/removed-symbols.yml'
      - '/ci-templates/badges.yml'
      - '/ci-templates/github-mirror.yml'
      - '/ci-templates/verified-fetch.yml'
      - '/ci-templates/tool-install.yml'
      - '/ci-templates/cross-cutting-lint.yml'
      - '/ci-templates/domain-calls.yml'
      - '/ci-templates/main-retest.yml'

# Temporary containment for the allyson compiler stall (vauchi/private#198).
# A tiny compile probe passed while real dependency compilation still hung.
.self-hosted:
  variables:
    RUSTC_WRAPPER: ""

variables:
  VAUCHI_SCRIPTS_REF: "ci-templates-v2026.11.17"
  # Shared-template checks (quality:*, file-size:*, allow-direct:check) are
  # held back on main too, like the checks marked below (vauchi/private#1179).
  MAIN_RETEST_TEMPLATES: "on"
  # cargo audit runs with --deny warnings; every entry here is an
  # advisory with no fix available to us, not one we chose to skip.
  #   RUSTSEC-2026-0173  proc-macro-error2 unmaintained, reached through
  #                      tabled_derive -> tabled (already at latest).
  AUDIT_IGNORES: "--ignore RUSTSEC-2026-0173"

stages:
  - auto-tag
  - lint
  - test
  - mutation
  - security
  - build
  - verify
  - deploy

# ============================================================
# Auto-Tag Stage (main branch only)
# ============================================================
# When Cargo.toml version is bumped and merged to main,
# automatically create a v{version} tag to trigger the release pipeline.

auto-tag:version:
  extends: .auto-tag
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "trigger"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Main re-runs only what the merged MR's pipeline did not prove on the
# same tree (vauchi/private#1179, decision 8). A job whose rules start
# with `!reference [.main-retest, rules]` is held back from main's push
# pipeline; main:retest-plan picks the held-back jobs that did not pass
# in the MR, and main:retest runs them as a child pipeline main waits
# for. The CI variable MAIN_RETEST=off runs them in main, as before.
# A job main runs only on some `changes:` is not held back: the child
# would run it on every merge.
main:retest-plan:
  extends: [.main-retest-plan]

# In lint, not the template's .pre: jobs ordered by stage after lint
# waited for the held-back jobs before, and wait for the child now.
main:retest:
  extends: [.main-retest-trigger]
  stage: lint

# ============================================================
# Lint Stage — Preflight Gate (runs on Rust code changes)
# ============================================================
# Cheapest checks run first. Test + security jobs wait for these
# to pass before starting (PI-13 fail-fast DAG).

lint:format:
  extends: [.rust-runner-nocache, .lint-format, .validation-rust, .timeout-quick]
  needs: []

lint:clippy:
  extends: [.rust-runner-readonly, .lint-clippy, .validation-rust, .timeout-cold-rebuild]
  needs: []

lint:humble:
  extends: .cross-cutting-lint
  rules:
    - !reference [.main-retest, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Exact-zero release gate (ADR-066): a release tag may carry no remaining
# Humble UI boundary violations, unlike MR ratchets which let existing
# debt shrink over time. Wired into build:release's needs below so a
# failing gate blocks publish:package:cli even though needs: makes that
# job DAG-ordered past the lint stage.
release:ratchet-zero:
  extends: .release-ratchet-zero

check:release-provenance:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  needs: []
  script:
    - ci/tests/release-provenance.test.sh
  rules:
    - !reference [.main-retest, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# e2e's smoke suite on this merge request's CLI (vauchi/private#1118).
# Core's gate runs the suite on e2e's in-process Core device and builds no
# CLI, so a Core change the CLI must follow can merge first; the CLI meets
# it here, at the pin bump. The CLI is built from this checkout with the
# Core it pins; e2e's relays are built at their pins.
test:e2e-smoke:
  extends: [.linux-runner, .timeout-cold-rebuild]
  stage: test
  needs: []
  variables:
    E2E_DIR: ${CI_PROJECT_DIR}/../e2e-for-cli-${CI_JOB_ID}
  script:
    - git clone --depth=1 "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/vauchi/e2e.git" "$E2E_DIR"
    - sh ci/e2e-smoke.sh "$E2E_DIR" "$CI_PROJECT_DIR"
  after_script:
    - rm -rf "${CI_PROJECT_DIR}/../e2e-for-cli-${CI_JOB_ID}"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - src/**/*
          - cli-display/**/*
          - Cargo.toml
          - Cargo.lock
          - ci/e2e-smoke.sh
          - .gitlab-ci.yml

# The contract of test:e2e-smoke.
check:e2e-smoke:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  needs: []
  script:
    - sh ci/tests/e2e-smoke.test.sh
  rules:
    - !reference [.main-retest, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Duplicate dependency check (advisory)
lint:duplicates:
  extends: [.rust-runner-nocache, .lint-duplicates-job, .timeout-quick]

# Unused dependency check. Blocking here although the shared template
# allows failure: the CLI has no unused dependency to excuse (private#810).
lint:machete:
  extends: [.rust-runner-nocache, .lint-machete-job, .timeout-quick]
  allow_failure: false

# ============================================================
# Test Stage (runs on Rust code changes, gated by lint)
# ============================================================

# MR: fast nextest (no coverage overhead)
test:unit:
  extends: [.rust-runner, .validation-rust, .timeout-cold-rebuild]
  stage: test
  needs:
    - job: lint:format
      optional: true
  script:
    - cargo nextest run --profile ci --all-targets --no-default-features
  artifacts:
    when: always
    reports:
      junit: target/nextest/ci/junit.xml
    expire_in: 1 week

check:display-release:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  needs: []
  before_script:
    - apk add --no-cache python3 py3-yaml
  script:
    - python3 ci/tests/display-release-gate.test.py
    - python3 ci/tests/package-publication.test.py
  rules: !reference [contract:replay, rules]

# ADR-078 D-11 looks for this job name in every shell repository: it replays
# the contract fixtures through the display crate with no engine.
contract:replay:
  extends: [.rust-runner, .timeout-cold-rebuild]
  stage: test
  needs: [check:display-release]
  script:
    - python3 ci/tests/display-boundary.test.py
    - cargo metadata --locked --all-features --format-version 1 > display-metadata.json
    - python3 ci/check-display-boundary.py display-metadata.json
    - cargo nextest run --profile ci --locked --package vauchi-cli-display --all-targets
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  artifacts:
    when: always
    paths:
      - display-metadata.json
    reports:
      junit: target/nextest/ci/junit.xml
    expire_in: 1 week

# Main: full coverage with llvm-cov
coverage:workspace:
  extends: [.coverage-job, .rust-runner, .timeout-cold-rebuild]
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.git-credentials, before_script]
    - rustup component add llvm-tools-preview 2>/dev/null || true
  variables:
    COVERAGE_EXTRA_FLAGS: "--no-default-features"
    COVERAGE_REPO_LABEL: "cli"

# Binary size tracking (main merges + release tags)
perf:binary-size:
  extends: [.binary-size-tracking-job, .rust-runner, .timeout-cold-rebuild]
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.git-credentials, before_script]
  variables:
    BINARY_SIZE_REPO_LABEL: "cli"
    BINARY_SIZE_EXTRA_FLAGS: "--no-default-features"

# ============================================================
# Mutation Stage (uses shared template from vauchi/scripts)
# ============================================================

# cargo-mutants tests a copy of the tree in a temp dir, where the
# CARGO_MANIFEST_DIR/../locales lookup in main.rs finds nothing and the
# baseline's --locale tests fail. Point the CLI at a real clone instead.
mutation:nightly:
  extends: [.mutation-nightly, .rust-runner]
  # ~650 mutants at up to ~8 s each overran .timeout-extended's 45 min
  # (job 16840854985) once the baseline stopped failing early.
  timeout: 2h
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.git-credentials, before_script]
    - !reference [.clone-locales, before_script]
  variables:
    MUTATION_EXTRA_FLAGS: "--no-default-features"
    VAUCHI_LOCALES_DIR: "$CI_PROJECT_DIR/../locales"

# ============================================================
# Security Stage (runs on dependency changes, gated by lint, parallel with test)
# ============================================================

security:audit:
  extends: [.rust-runner-readonly, .security-audit-job]

security:deny:
  extends: [.rust-runner-readonly, .security-deny-job]

# deny.toml's git sources match the reviewed list in vauchi/scripts
# policy/allowed-git-sources.txt (vauchi/private#1162).
check:allow-git:
  extends: [.allow-git-drift-job]
  rules:
    - !reference [.main-retest, rules]
    - !reference [.allow-git-drift-job, rules]

# Supply chain verification (cargo-vet).
#
# Split into two jobs by trigger:
#   security:vet         — MR pipelines: plain `cargo vet --locked` against
#                          the committed Cargo.lock. Matches the documented
#                          principle in security.yml:152 ("never regenerate,
#                          as newer versions may lack exemptions"). MRs that
#                          legitimately bump Cargo.lock must also commit the
#                          matching exemption updates (run `cargo vet
#                          regenerate exemptions` locally).
#   security:vet-autofix — main + schedule only: regenerates the lockfile
#                          (drops path overrides), syncs exemptions from
#                          vauchi-core via cross-project CI_JOB_TOKEN, and on
#                          remaining unvetted deps opens an auto-merge MR
#                          (with the predecessor-cleanup behavior added in
#                          scripts!374).
#
# Pre-2026-05-28 a single `security:vet` extended `.security-vet-autofix-job`
# for all triggers, so every MR ran the regen step — racing against upstream
# transitive dep churn (every `compact_str 0.8.1 → 0.8.2` registry push broke
# MRs that touched Cargo.lock). The split below restores the documented
# committed-lockfile invariant for MR gating.
security:vet:
  extends: [.rust-runner-readonly, .security-vet-job]

security:vet-autofix:
  extends: [.rust-runner-readonly, .security-vet-autofix-job, .verified-fetch-script]
  # .verified-fetch-script defines before_script and, extended last, would
  # replace the runner template's: without it the job takes whatever rustc
  # is on the runner's PATH (Homebrew's on nell — vauchi/private#486).
  before_script:
    - !reference [.rust-runner-readonly, before_script]
    - !reference [.verified-fetch-script, before_script]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
  variables:
    FETCH_SCRIPT_PATH: "scripts/ci/vet-autofix.sh"
    FETCH_SCRIPT_OUTPUT: "vet-autofix.sh"
    FETCH_SCRIPT_SHA256: "411e1562c96f7dc6f74153575839f1faa0ad276b3866ea1c7f5cad68fd9a41d5"
  script:
    - ./vet-autofix.sh --sync-from=77874344

# ============================================================
# Advisory: Cargo.lock Freshness Check
# ============================================================
# Passes when the Core pin is merely behind main; fails, and blocks, only
# when the pin points at a commit Core no longer has (private#810).

check:core-freshness:
  extends: .check-core-freshness
  allow_failure: false

# Blocks MRs with non-main branch refs in Cargo.toml git dependencies.
check:branch-refs:
  extends: .check-git-branch-refs

# Run after qualification: an early failure auto-cancels the other jobs.
check:core-release-pin:
  extends: [.linux-runner-nocache, .verified-fetch-script]
  stage: .post
  allow_failure: false
  when: always
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.verified-fetch-script, before_script]
  variables:
    VAUCHI_SCRIPTS_REF: "f1270b2757366a07cf222c21f7ed71b5eec2d222"
    FETCH_SCRIPT_PATH: "scripts/core-pins.py"
    FETCH_SCRIPT_OUTPUT: ".core-release-pin-check.py"
    FETCH_SCRIPT_SHA256: "195602c75ae189bc499fafe168633ed2fe18fcd9e320c202b47e2e0cf09a1e20"
  script:
    - python3 .core-release-pin-check.py require-release --kind cargo Cargo.toml --lockfile Cargo.lock --verify-tag
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Presentation drift: verify every canonical presentation node is rendered.
check:design-drift:
  extends: .design-drift-job
  variables:
    DESIGN_DRIFT_MATCH_MODE: "grep"
    DESIGN_DRIFT_GREP_FILE: "cli-display/src/presentation"
    DESIGN_DRIFT_PROTOCOL: "presentation"
    CORE_PIN_FILE: "Cargo.toml"
    CORE_PIN_KIND: "cargo"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "cli-display/src/presentation/**"
          - ".gitlab-ci.yml"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        paths:
          - "cli-display/src/presentation/**"
          - ".gitlab-ci.yml"

# Removed symbols: detect stale references to removed features
check:removed-symbols:
  extends: .removed-symbols-job
  rules:
    - !reference [.main-retest, rules]
    - !reference [.removed-symbols-job, rules]

# ============================================================
# Dev Tag Pipeline (lightweight — lint + test only)
# ============================================================
# Triggered by v0.2.3-dev.N tags. Fast feedback, no coverage/mutation/publish.

dev:verify:
  extends: [.rust-runner-nocache, .dev-verify]
  stage: lint
  needs: []

dev:lint:format:
  extends: [.rust-runner-nocache, .dev-lint-format]

dev:lint:clippy:
  extends: [.rust-runner-readonly, .dev-lint-clippy]

dev:test:
  extends: [.rust-runner, .dev-test-nextest, .timeout-standard]
  variables:
    DEV_TEST_EXTRA_FLAGS: "--no-default-features"

# ============================================================
# RC Tag Pipeline (full quality gate — no publish/deploy)
# ============================================================
# Triggered by v0.2.3-rc.N tags. Full coverage + mutation.

rc:verify:
  extends: [.rust-runner-nocache, .rc-verify]
  stage: lint
  needs: []

rc:lint:format:
  extends: [.rust-runner-nocache, .rc-lint-format]

rc:lint:clippy:
  extends: [.rust-runner-readonly, .rc-lint-clippy]

rc:test:
  extends: [.coverage-job, .rust-runner, .timeout-long]
  needs:
    - job: rc:lint:format
      optional: true
    - job: rc:lint:clippy
      optional: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.git-credentials, before_script]
    - rustup component add llvm-tools-preview 2>/dev/null || true
  variables:
    COVERAGE_EXTRA_FLAGS: "--no-default-features"
    COVERAGE_REPO_LABEL: "cli"

rc:mutation:
  extends: [.mutation-nightly, .rust-runner, .timeout-extended]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/
  variables:
    MUTATION_EXTRA_FLAGS: "--no-default-features"

rc:security:audit:
  extends: [.rust-runner-readonly, .rc-security-audit]

# ============================================================
# Build Stage
# ============================================================

build:release:
  extends: [.linux-runner, .timeout-standard]
  stage: build
  needs:
    - job: contract:replay
    - job: test:unit
      optional: true
    - job: lint:format
      optional: true
    - job: release:ratchet-zero
      optional: true
  script:
    - cargo build --release --locked
  artifacts:
    paths:
      - target/release/vauchi
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    # Run in MRs when dependency pins change so Cargo verifies the lockfile.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "Cargo.toml"
          - "Cargo.lock"
          - ".gitlab-ci.yml"

# Publish the release binary to the GitLab generic package registry so
# downstream E2E tests can fetch it by SHA or tag instead of rebuilding.
publish:package:cli:
  stage: deploy
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  needs:
    - job: build:release
      artifacts: true
  variables:
    PACKAGE_NAME: "vauchi-cli"
    BINARY_NAME: "vauchi-cli-linux-amd64"
  before_script:
    - apk add --no-cache curl coreutils
  script:
    - |
      set -euo pipefail
      cp target/release/vauchi "${BINARY_NAME}"
      sha256sum "${BINARY_NAME}" > "${BINARY_NAME}.sha256"

      upload_package() {
        local version="$1"
        local base="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${version}"
        curl -fsSL --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "${BINARY_NAME}" "${base}/${BINARY_NAME}"
        curl -fsSL --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "${BINARY_NAME}.sha256" "${base}/${BINARY_NAME}.sha256"
        echo "✅ Published ${PACKAGE_NAME}@${version}"
      }

      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        upload_package "${CI_COMMIT_TAG}"
      else
        upload_package "${CI_COMMIT_SHA}"
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    # An upstream-triggered rerun rebuilds the same SHA with newer core
    # main — same package version, different content; the registry
    # rejects the duplicate with 400. Only the push pipeline publishes.
    - if: $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "trigger"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ============================================================
# Verify Stage (upstream trigger only)
# ============================================================
# Runs when core merges to main and triggers this repo via
# verify:downstream-rust. Verifies this repo builds and tests
# pass against the updated vauchi-core.

verify:upstream-compat:
  extends: [.rust-runner, .verify-on-upstream, .verify-nextest-artifacts, .timeout-standard]
  stage: verify
  needs: []
  script:
    - cargo nextest run --profile ci --all-targets --no-default-features

# Runs when core creates a dev/RC tag and triggers this repo.
# Verifies this repo builds and tests pass against the core tag.
verify:upstream-prerelease:
  extends: [.rust-runner, .verify-on-upstream-prerelease, .verify-nextest-artifacts, .timeout-standard]
  stage: verify
  needs: []
  script:
    - cargo nextest run --profile ci --all-targets --no-default-features

# ============================================================
# Deploy Stage — Badge Pages
# ============================================================

pages:
  extends: .badges-pages
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "api"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always

github-mirror:
  extends: .github-mirror
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "trigger"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

# Humble UI (ADR-021/043) and VRS02 (ADR-066): fail an MR that adds a
# domain-mutating call or a form-factor branch beyond .audit-baseline.json.
# The template defaults VAUCHI_SCRIPTS_REF to main; pin it to the include.
lint:domain-calls:
  extends: .domain-calls-job
  rules:
    - !reference [.main-retest, rules]
    - !reference [.domain-calls-job, rules]
  variables:
    VAUCHI_SCRIPTS_REF: "ci-templates-v2026.11.17"
